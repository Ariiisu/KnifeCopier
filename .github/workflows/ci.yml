name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KnifeCopier/KnifeCopier.csproj

      - name: Publish (Release)
        run: dotnet publish KnifeCopier/KnifeCopier.csproj -c Release --no-restore -o "$RUNNER_TEMP/publish"

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble server layout
        run: |
          set -euo pipefail
          mkdir -p dist/sharp/modules/KnifeCopier dist/sharp/locales
          cp -r "$RUNNER_TEMP/publish/." dist/sharp/modules/KnifeCopier/
          cp sharp/locales/knifecopier.json dist/sharp/locales/
          find dist -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnifeCopier-${{ steps.ver.outputs.version }}
          path: dist
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: KnifeCopier-${{ needs.build.outputs.version }}
          path: dist

      - name: Package zip
        run: |
          cd dist
          zip -r "$GITHUB_WORKSPACE/KnifeCopier-${{ needs.build.outputs.version }}.zip" sharp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: KnifeCopier-${{ needs.build.outputs.version }}.zip
          generate_release_notes: true
